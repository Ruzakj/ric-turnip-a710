name: Build RIC Turnip A710 - 3 Variants

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['.github/workflows/build.yml']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [stable, performance, experimental]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install builder dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools flex bison ninja-build python3-pip python3-mako python3-yaml pkg-config cmake curl unzip zip
          python3 -m pip install --break-system-packages --upgrade 'meson>=1.4.0'
          meson --version
      - name: Clone proven A710 builder
        run: git clone --depth=1 https://github.com/Vauzi-17/710.git upstream
      - name: Configure variant
        run: |
          cp upstream/turnip_builder.sh ./turnip_builder.sh
          chmod +x turnip_builder.sh
          case "${{ matrix.variant }}" in
            stable)
              echo "RIC_VARIANT=stable" >> "$GITHUB_ENV"
              ;;
            performance)
              echo "RIC_VARIANT=performance" >> "$GITHUB_ENV"
              # Keep upstream A710 hardware config; add compiler optimization only.
              sed -i 's/-Dbuildtype=release/-Dbuildtype=release -Db_lto=true/' turnip_builder.sh || true
              ;;
            experimental)
              echo "RIC_VARIANT=experimental" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Build using A710 upstream pipeline
        run: BUILD_VERSION=3.9 bash ./turnip_builder.sh
      - name: Prepare Eden-compatible artifact
        run: |
          set -euo pipefail
          mkdir -p dist/eden
          DRIVER_ZIP="$(find . -type f -name '*.zip' -path '*/turnip_workdir/out/*' -print -quit)"
          test -n "$DRIVER_ZIP"
          unzip -j "$DRIVER_ZIP" 'libvulkan_freedreno.so' 'meta.json' -d dist/eden
          test -s dist/eden/libvulkan_freedreno.so
          test -s dist/eden/meta.json
          python3 - <<'PY'
          import json
          p='dist/eden/meta.json'
          m=json.load(open(p))
          required=['name','description','author','vendor','driverVersion','minApi','libraryName']
          missing=[k for k in required if k not in m]
          assert not missing, f"Missing Eden metadata: {missing}"
          assert m['libraryName']=='libvulkan_freedreno.so'
          print('Eden metadata OK:', m['name'], m['driverVersion'])
          PY
          ls -lh dist/eden
      - uses: actions/upload-artifact@v4
        with:
          name: RIC-Turnip-A710-${{ matrix.variant }}-EDEN
          path: |
            dist/eden/libvulkan_freedreno.so
            dist/eden/meta.json
          if-no-files-found: error
