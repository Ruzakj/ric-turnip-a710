name: Build RIC Turnip A710 - 3 Variants

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [stable, performance, experimental]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-mako meson ninja-build             glslang-tools libdrm-dev libexpat1-dev libelf-dev libwayland-dev wayland-protocols             libx11-xcb-dev libxcb-dri3-dev libxcb-present-dev libxcb-randr0-dev libxcb-shm0-dev             libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev pkg-config cmake curl unzip zip
          python3 -m pip install --break-system-packages mako pyyaml

      - name: Install Android NDK
        run: |
          curl -L -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r27c" >> "$GITHUB_ENV"

      - name: Clone Mesa and A710 research baseline
        run: |
          git clone --depth=1 https://gitlab.freedesktop.org/mesa/mesa.git mesa
          git clone --depth=1 https://github.com/Vauzi-17/710.git a710-reference
          python3 a710-reference/add_710_720_722.py mesa

      - name: Apply variant policy
        run: bash scripts/apply-variant.sh "${{ matrix.variant }}"

      - name: Build Turnip
        run: bash scripts/build-turnip.sh "${{ matrix.variant }}"

      - name: Package AdrenoTools driver
        run: bash scripts/package.sh "${{ matrix.variant }}"

      - uses: actions/upload-artifact@v4
        with:
          name: RIC-Turnip-A710-${{ matrix.variant }}
          path: dist/*.zip
          if-no-files-found: error
